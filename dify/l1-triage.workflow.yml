        source: agent
        sourceHandle: source
        target: validate
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: http-request
        id: edge-validate-approval
        source: validate
        sourceHandle: source
        target: approval
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: http-request
          targetType: code
        id: edge-approval-approval_parse
        source: approval
        sourceHandle: source
        target: approval_parse
        targetHandle: target
