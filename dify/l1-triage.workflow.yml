# Dify 1.16 / DSL 0.7.0
#
# 导入后必须做两件事，否则 Agent 无法调用工具：
# 1. 在 Agent 节点的工具列表里手动绑定两个自定义工具：
#      fetch_wazuh_alerts、search_attack_knowledge
#    （自定义工具的 provider_id 不能跨工作区移植，所以这里故意留空。）
# 2. 确认模型 provider 是当前工作区已安装的 DeepSeek 插件；
#    模型默认 deepseek-flash；如果 provider_id 或模型列表不同，改成实际值。
#
# 审批 HTTP 节点默认指向 host.docker.internal:8002；
# Linux 部署请改成宿主机 IP 或 docker compose 服务名，并配置 Authorization。
app:
  description: Wazuh 告警 L1 分诊：close / watch / escalate，破坏性动作只给建议并转人工审批。
  icon: 🛡️
  icon_background: "#E8F0FF"
  mode: workflow
  name: SOC L1 告警分诊
  use_icon_as_answer_icon: false
